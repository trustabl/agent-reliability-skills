name: Release

# On a v* tag: verify the bundle and versions, pack the server, and publish the
# package file with its checksum on the GitHub release. Installs download that
# file, so GitHub counts them (TR-1309).
#
# The same release also ships the server as an MCP Bundle (.mcpb, for Claude
# Desktop and Smithery), the npm package @trustabl/agent-reliability-skills
# (once the repository has an NPM_TOKEN secret), and a filled-in server.json,
# which it publishes to the MCP Registry.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write    # npm provenance and the MCP Registry login

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # npm publishing (below) runs only once this repository has the secret.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        working-directory: server
        run: npm ci
      - name: Unit tests
        working-directory: server
        run: npm test
      - name: Rebuild the bundle
        working-directory: server
        run: npm run build
      - name: dist/ must match server/
        run: |
          if ! git diff --exit-code -- dist/index.js; then
            echo "::error::dist/index.js is stale for this tag."
            exit 1
          fi
      - name: Tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
      - name: Install paths point at this release
        run: node scripts/check-install-paths.mjs
      - name: README has no unmeasured results
        run: |
          if grep -n 'RESULT-' README.md; then
            echo "::error::README.md still has RESULT- markers; record the measurements first."
            exit 1
          fi
          # A pre-release measurement build swaps the markers for the word
          # "pending"; only another pre-release (a tag with a "-") may keep it.
          case "$GITHUB_REF_NAME" in
            *-*) ;;
            *)
              if grep -nw 'pending' README.md; then
                echo "::error::README.md still has 'pending' markers; replace them with the measured results."
                exit 1
              fi
              ;;
          esac
      # The Claude Directory needs the plugin to launch an exact npm version, so
      # plugin/ pins one. It can only point at a version npm already has, so it
      # is bumped in a follow-up pull request once this release is published.
      - name: Check the plugin's pinned version
        run: |
          v="${GITHUB_REF_NAME#v}"
          for f in plugin/.mcp.json plugin/mcp.json; do
            grep -q "@trustabl/agent-reliability-skills@$v\"" "$f" || echo "::warning file=$f::pins a different version than $GITHUB_REF_NAME; after this release, update it to @$v"
          done
      - name: Pack
        run: |
          file=$(npm pack --silent | tail -1)
          sha256sum "$file" > checksums.txt
          cat checksums.txt
          echo "PACKAGE=$file" >> "$GITHUB_ENV"
      # The server as an MCP Bundle, and the MCP Registry record for this
      # release, ready for mcp-publisher. .mcpbignore keeps the bundle to the
      # runtime files. The bundle is a release file, so GitHub counts it too.
      - name: Bundle and registry record
        run: |
          v="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('manifest.json'));m.version=process.argv[1];fs.writeFileSync('manifest.json',JSON.stringify(m,null,2)+'\n')" "$v"
          b="agent-reliability-skills-$v.mcpb"
          npx -y @anthropic-ai/mcpb@2.1.2 pack . "$b"
          sha256sum "$b" >> checksums.txt
          node -e "const fs=require('fs');const [v,b,sha]=process.argv.slice(1);const s=JSON.parse(fs.readFileSync('server.json'));s.version=v;const p=s.packages[0];p.version=v;p.identifier='https://github.com/trustabl/agent-reliability-skills/releases/download/v'+v+'/'+b;p.fileSha256=sha;fs.writeFileSync('server.json',JSON.stringify(s,null,2)+'\n')" "$v" "$b" "$(sha256sum "$b" | cut -d' ' -f1)"
          echo "BUNDLE=$b" >> "$GITHUB_ENV"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$PACKAGE" "$BUNDLE" checksums.txt --title "$GITHUB_REF_NAME" --generate-notes $flags
      # npm under our @trustabl scope, so `npx -y @trustabl/agent-reliability-skills`
      # works in every client and the registry record gains an npm package.
      # package.json's mcpName proves registry ownership. The repository keeps
      # the unscoped name so the release file keeps its counted name.
      # A pre-release goes to the "next" tag, so `latest` only moves on a release.
      - name: Publish to npm
        if: env.HAS_NPM_TOKEN == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm pkg set name=@trustabl/agent-reliability-skills
          tag=latest
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          npm publish --provenance --access public --tag "$tag"
          node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('server.json'));s.packages.unshift({registryType:'npm',identifier:'@trustabl/agent-reliability-skills',version:s.version,transport:{type:'stdio'}});fs.writeFileSync('server.json',JSON.stringify(s,null,2)+'\n')"
      - name: Attach the registry record
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" server.json
      # The MCP Registry, with no device code: GitHub's OIDC token shows this
      # run belongs to a trustabl repository, which owns io.github.trustabl/*.
      # The registry checks the npm package's mcpName, so wait until npm serves
      # the new version first (it can take a few minutes after publishing).
      - name: Publish to the MCP Registry
        run: |
          if [ "$HAS_NPM_TOKEN" = "true" ]; then
            v="${GITHUB_REF_NAME#v}"
            for i in $(seq 1 30); do
              curl -sf "https://registry.npmjs.org/@trustabl%2fagent-reliability-skills/$v" | grep -q '"mcpName"' && break
              echo "waiting for npm to serve $v ($i/30)"; sleep 10
            done
          fi
          base=https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7
          curl -sSLO "$base/mcp-publisher_linux_amd64.tar.gz"
          curl -sSL "$base/registry_1.8.7_checksums.txt" | grep " mcp-publisher_linux_amd64.tar.gz$" | sha256sum -c -
          tar -xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
