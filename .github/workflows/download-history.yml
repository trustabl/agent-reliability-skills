name: Download history

# Weekly snapshot of cumulative downloads of the agent-reliability-skills package file.
# GitHub exposes only the current total per release asset (download_count),
# with no history, so each run records one dated entry and commits it.
# A same-day rerun replaces that day's entry; earlier entries are never changed.

on:
  schedule:
    - cron: '0 5 * * 1'       # weekly, Mondays 05:00 UTC
  workflow_dispatch:           # run on demand to add an entry now

permissions:
  contents: write              # commit the snapshot to main

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record cumulative downloads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          HISTORY_FILE: .github/stats/download-history.json
          # Only the package file is an install; checksums.txt downloads are not.
          PACKAGE_PREFIX: agent-reliability-skills-
        run: |
          python3 - <<'PY'
          import datetime, json, os, urllib.request

          repo   = os.environ["TARGET_REPO"]
          path   = os.environ["HISTORY_FILE"]
          prefix = os.environ["PACKAGE_PREFIX"]
          token  = os.environ.get("GITHUB_TOKEN", "")

          def api(url):
              req = urllib.request.Request(url)
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("X-GitHub-Api-Version", "2022-11-28")
              req.add_header("User-Agent", "agent-reliability-skills-download-history")
              if token:
                  req.add_header("Authorization", "Bearer " + token)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          releases, page = {}, 1
          while True:
              rels = api("https://api.github.com/repos/%s/releases?per_page=100&page=%d" % (repo, page))
              if not rels:
                  break
              for rel in rels:
                  if rel.get("draft"):
                      continue
                  releases[rel["tag_name"]] = sum(
                      a.get("download_count", 0)
                      for a in rel.get("assets", [])
                      if a.get("name", "").startswith(prefix) and a["name"].endswith(".tgz")
                  )
              if len(rels) < 100:
                  break
              page += 1

          day = datetime.date.today().isoformat()   # YYYY-MM-DD (UTC on the runner)

          if os.path.exists(path):
              with open(path) as f:
                  data = json.load(f)
          else:
              data = {"history": []}

          hist = {p["date"]: p for p in data.get("history", [])}
          # "date" and "downloads" match the probe's history format
          # (agent-network-access-probe); "releases" is Forge's per-release split.
          hist[day] = {
              "date": day,
              "downloads": sum(releases.values()),
              "releases": {tag: releases[tag] for tag in sorted(releases)},
          }
          out = {
              "repo": repo,
              "unit": "cumulative_release_downloads",
              "note": "Downloads of the release package file, not users. Includes automated installs such as CI.",
              "history": [hist[d] for d in sorted(hist)],
          }

          os.makedirs(os.path.dirname(path), exist_ok=True)
          with open(path, "w") as f:
              json.dump(out, f, indent=2)
              f.write("\n")
          print("%s: %s = %d cumulative package downloads across %d releases" % (day, repo, out["history"][-1]["downloads"], len(releases)))
          PY

      # main is not branch-protected, so the snapshot is committed straight to
      # it, as the probe does. Each run builds on the committed file, so no
      # week's entry waits on (or is lost with) an unmerged PR. If main ever
      # requires pull requests, this push fails and needs another route.
      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/stats/download-history.json
          if git diff --cached --quiet; then
            echo "No change in downloads since the last snapshot."
            exit 0
          fi
          git commit -m "chore: record weekly download snapshot"
          git push
