name: CI

# dist/index.js is committed and package.json "bin" points straight at it, so a
# stale bundle ships a broken server to everyone who installs a release. The
# bundle job catches that; the test job runs the unit tests and the stdio smoke
# test on all three operating systems the server supports.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        working-directory: server
        run: npm ci
      - name: Rebuild the bundle
        working-directory: server
        run: npm run build
      # On a clean checkout a rebuild must be a no-op. If it is not, someone
      # edited server/ without rebuilding dist/.
      - name: dist/ must match server/
        run: |
          if ! git diff --exit-code -- dist/index.js; then
            echo "::error::dist/index.js is stale. Run 'npm run build' in server/ and commit the result."
            exit 1
          fi
      - name: Install paths point at the release file
        run: node scripts/check-install-paths.mjs

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        working-directory: server
        run: npm ci
      - name: Unit tests
        working-directory: server
        run: npm test
      - name: Smoke test (stdio, cold and warm start, real trustabl forge)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/smoke.mjs
