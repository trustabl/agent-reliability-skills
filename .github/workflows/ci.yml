name: CI

# dist/index.js is committed and package.json "bin" points straight at it, so a
# stale bundle ships a broken server to everyone who installs a release. The
# bundle job catches that; the test job runs the unit tests, the stdio smoke
# test and the integration test on all three operating systems the server
# supports, on the oldest Node it supports (package.json "engines") and the
# current LTS.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        working-directory: server
        run: npm ci
      - name: Rebuild the bundle
        working-directory: server
        run: npm run build
      # On a clean checkout a rebuild must be a no-op. If it is not, someone
      # edited server/ without rebuilding dist/.
      - name: dist/ must match server/
        run: |
          if ! git diff --exit-code -- dist/index.js; then
            echo "::error::dist/index.js is stale. Run 'npm run build' in server/ and commit the result."
            exit 1
          fi
      - name: Install paths point at the release file
        run: node scripts/check-install-paths.mjs
      # The install-path check, the release guards and the download-history
      # Python, each run against throwaway inputs.
      - name: Script and workflow tests
        run: node --test scripts/*.test.mjs

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # Without this, setup-node takes whatever 22.x the runner has cached.
          # The integration test's offline check needs 22.21 or later, the
          # first release whose fetch honors the proxy variables.
          check-latest: true
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Node version
        run: node --version
      - name: Install
        working-directory: server
        run: npm ci
      - name: Unit tests
        working-directory: server
        run: npm test
      - name: Smoke test (stdio, cold and warm start, real trustabl forge)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/smoke.mjs
      - name: Integration test (packed npx install, output_path, no SDK, pinned version, offline)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/integration.mjs
